<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a10">
  <title>Game Center — Catalogue</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f6fb;
      background: #090a10;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #9a9daf;
      --line: rgba(255, 255, 255, .1);
      --cyan: #31e5f1;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% -18%, rgba(96, 58, 160, .24), transparent 42rem),
        #090a10;
    }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin-inline: auto;
    }

    header {
      display: grid;
      justify-items: center;
      padding: 46px 0 32px;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      display: block;
      width: min(100%, 370px);
      max-height: 180px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 14px;
      box-shadow: 0 12px 50px rgba(0, 0, 0, .35), 0 0 35px rgba(49, 229, 241, .08);
    }

    main { padding: 44px 0 72px; }

    .heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 850;
      letter-spacing: -.055em;
    }

    .count {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: .9rem;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    input, select {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: #f5f6fb;
      background: rgba(18, 19, 29, .92);
      font: inherit;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 0 15px;
    }

    select { padding: 0 38px 0 14px; }
    input::placeholder { color: #777b8d; }
    input:focus, select:focus { border-color: rgba(49, 229, 241, .65); }

    .games {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(160deg, rgba(26, 27, 40, .98), rgba(15, 16, 24, .98));
      transition: transform .2s ease, border-color .2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(49, 229, 241, .42);
    }

    .cover {
      position: relative;
      display: block;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #11131d;
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .details { padding: 17px; }

    .genre {
      margin: 0 0 7px;
      color: var(--cyan);
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h2 {
      margin: 0;
      font-size: 1.28rem;
      letter-spacing: -.025em;
    }

    .description {
      min-height: 43px;
      margin: 9px 0 0;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.55;
    }

    .play-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 13px;
      border-top: 1px solid var(--line);
      color: #e7e8f2;
      font-size: .86rem;
      font-weight: 700;
      text-decoration: none;
    }

    .play-link span:last-child {
      color: var(--cyan);
      font-size: 1.1rem;
      transition: transform .2s ease;
    }

    .play-link:hover span:last-child { transform: translateX(4px); }

    .empty {
      grid-column: 1 / -1;
      padding: 38px 20px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 780px) {
      .games { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 540px) {
      .page { width: min(100% - 28px, 1120px); }
      header { padding-top: 28px; }
      .logo { width: min(100%, 330px); }
      main { padding-top: 32px; }
      .heading { align-items: start; flex-direction: column; gap: 8px; }
      .controls { flex-direction: column; }
      select { width: 100%; }
      .games { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <img class="logo" src="gamecenter.jpeg" alt="Logo Game Center — E-Sports & Gaming Community">
    </header>

    <main>
      <div class="heading">
        <h1>Catalogue des jeux</h1>
        <p class="count" id="count" aria-live="polite"></p>
      </div>

      <div class="controls">
        <input id="search" type="search" placeholder="Rechercher un jeu…" aria-label="Rechercher un jeu">
        <select id="genre" aria-label="Filtrer par genre">
          <option value="">Tous les genres</option>
        </select>
      </div>

      <section class="games" id="games" aria-label="Jeux du catalogue" aria-live="polite"></section>
    </main>
  </div>

  <script>
    // Pour modifier le catalogue, change cette liste dans le code.
    const jeux = [
      {
        title: "Le Gardien du Cimetière",
        genre: "Aventure",
        description: "Un jeu d’évasion dans un cimetière mystérieux.",
        image: "gardien-du-cimetiere.jpeg",
        link: "https://maxrp57.github.io/Cimeti-re-/"
      },
      {
        title: "Aéropilote",
        genre: "Simulation",
        description: "Un simulateur de vol pour prendre les commandes.",
        image: "aeropilote.jpeg",
        link: "https://maxrp57.github.io/Air/"
      },
      {
        title: "Dossier Secret",
        genre: "Mystère",
        description: "Un jeu d’enquête et de mystère.",
        image: "dossier-secret.jpeg",
        link: "https://maxrp57.github.io/redfile/"
      }
    ];

    const grille = document.querySelector("#games");
    const recherche = document.querySelector("#search");
    const filtreGenre = document.querySelector("#genre");
    const compteur = document.querySelector("#count");

    [...new Set(jeux.map(jeu => jeu.genre))].forEach(genre => {
      filtreGenre.add(new Option(genre, genre));
    });

    function afficherJeux() {
      const terme = recherche.value.trim().toLocaleLowerCase("fr");
      const genre = filtreGenre.value;
      const resultats = jeux.filter(jeu =>
        (!genre || jeu.genre === genre) &&
        `${jeu.title} ${jeu.genre} ${jeu.description}`.toLocaleLowerCase("fr").includes(terme)
      );

      compteur.textContent = `${resultats.length} jeu${resultats.length === 1 ? "" : "x"}`;
      grille.replaceChildren();

      if (resultats.length === 0) {
        const message = document.createElement("p");
        message.className = "empty";
        message.textContent = "Aucun jeu trouvé.";
        grille.append(message);
        return;
      }

      resultats.forEach(jeu => {
        const carte = document.createElement("article");
        carte.className = "card";

        const couverture = document.createElement("div");
        couverture.className = "cover";

        const image = document.createElement("img");
        image.src = jeu.image;
        image.alt = `Logo du jeu ${jeu.title}`;
        couverture.append(image);

        const details = document.createElement("div");
        details.className = "details";

        const etiquette = document.createElement("p");
        etiquette.className = "genre";
        etiquette.textContent = jeu.genre;

        const titre = document.createElement("h2");
        titre.textContent = jeu.title;

        const description = document.createElement("p");
        description.className = "description";
        description.textContent = jeu.description;

        const lien = document.createElement("a");
        lien.className = "play-link";
        lien.href = jeu.link;
        lien.target = "_blank";
        lien.rel = "noopener noreferrer";

        const libelle = document.createElement("span");
        libelle.textContent = "Jouer";
        const fleche = document.createElement("span");
        fleche.setAttribute("aria-hidden", "true");
        fleche.textContent = "↗";
        lien.append(libelle, fleche);

        details.append(etiquette, titre, description, lien);
        carte.append(couverture, details);
        grille.append(carte);
      });
    }

    recherche.addEventListener("input", afficherJeux);
    filtreGenre.addEventListener("change", afficherJeux);
    afficherJeux();
  </script>
</body>
</html>
