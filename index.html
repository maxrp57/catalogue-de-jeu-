<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b13">
  <title>Game Center — Accueil</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f7fc;
      background: #080b13;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #a4adbf;
      --line: rgba(224, 234, 255, .13);
      --cyan: #8beaff;
      --page-width: 1440px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 85% 22%, rgba(35, 101, 193, .25), transparent 38rem),
        radial-gradient(ellipse at 16% 36%, rgba(91, 48, 147, .13), transparent 33rem),
        linear-gradient(160deg, #0b1120 0%, #080b13 58%, #0c1020 100%);
    }

    button, input { font: inherit; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 4px;
    }

    .topbar, main {
      width: min(var(--page-width), calc(100% - 72px));
      margin-inline: auto;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      min-height: 82px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 12px;
      color: inherit;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: 83px;
      height: 39px;
      object-fit: cover;
      border-radius: 6px;
      background: #111827;
    }

    .brand-name {
      font-size: .79rem;
      font-weight: 780;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      height: 82px;
      align-items: stretch;
      gap: 30px;
    }

    .nav-links a {
      position: relative;
      display: inline-flex;
      align-items: center;
      color: #aeb8ca;
      font-size: .98rem;
      text-decoration: none;
      transition: color .18s ease;
    }

    .nav-links a:hover, .nav-links a[aria-current="page"] { color: #fff; }
    .nav-links a[aria-current="page"] { font-weight: 750; }
    .nav-links a[aria-current="page"]::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 2px;
      background: var(--cyan);
      content: "";
      box-shadow: 0 0 18px rgba(139, 234, 255, .65);
    }

    .topbar-search {
      display: flex;
      justify-self: end;
      width: min(100%, 250px);
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 24px;
      color: var(--muted);
      background: rgba(8, 13, 24, .65);
    }

    .topbar-search svg { flex: 0 0 auto; }
    .topbar-search input {
      width: 100%;
      min-width: 0;
      height: 37px;
      border: 0;
      outline: 0;
      color: #f5f7fc;
      background: transparent;
      font-size: .82rem;
    }
    .topbar-search input::placeholder { color: #9aa5b7; }
    .topbar-search:focus-within { border-color: rgba(139, 234, 255, .7); }

    main { padding: 27px 0 52px; }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2.4vw, 1.8rem);
      font-weight: 680;
      letter-spacing: -.035em;
    }

    .count {
      margin: 0 2px 3px 0;
      color: var(--muted);
      font-size: .8rem;
      white-space: nowrap;
    }

    .games {
      display: flex;
      align-items: start;
      gap: 12px;
      overflow-x: auto;
      padding: 3px 3px 10px;
      scroll-behavior: smooth;
      scrollbar-color: rgba(174, 193, 223, .27) transparent;
      scrollbar-width: thin;
    }

    .game-tile {
      flex: 0 0 104px;
      min-width: 0;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 12px;
      color: inherit;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .game-tile:hover { transform: translateY(-2px); }
    .game-tile[aria-pressed="true"] {
      flex-basis: 132px;
      border-color: rgba(228, 242, 255, .86);
      background: rgba(226, 238, 255, .09);
      box-shadow: 0 0 0 1px rgba(228, 242, 255, .2), 0 10px 32px rgba(0, 0, 0, .28);
    }

    .tile-art {
      position: relative;
      display: grid;
      aspect-ratio: 1 / 1;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(224, 234, 255, .1);
      border-radius: 11px;
      background:
        radial-gradient(ellipse at 50% 35%, rgba(117, 163, 225, .22), transparent 64%),
        linear-gradient(150deg, #202a3a, #111724);
    }

    .tile-art img {
      display: block;
      width: 100%;
      height: 100%;
      padding: 10px;
      object-fit: contain;
      transition: transform .25s ease;
    }

    .game-tile:hover .tile-art img { transform: scale(1.05); }
    .game-tile[aria-pressed="true"] .tile-art { border-color: transparent; }
    .game-tile[aria-pressed="true"] .tile-art img { padding: 7px; }

    .wallpaper {
      position: relative;
      display: flex;
      min-height: clamp(280px, 35vw, 410px);
      align-items: end;
      overflow: hidden;
      isolation: isolate;
      margin: 3px -4vw 22px;
      padding: 45px max(4vw, 48px);
      border-top: 1px solid rgba(219, 232, 255, .09);
      border-bottom: 1px solid rgba(219, 232, 255, .1);
      background:
        radial-gradient(ellipse at 79% 30%, rgba(44, 122, 224, .37), transparent 38%),
        radial-gradient(ellipse at 29% 92%, rgba(103, 56, 154, .22), transparent 40%),
        linear-gradient(117deg, #101829, #10172a 46%, #111b31 100%);
    }

    .wallpaper::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        radial-gradient(ellipse at 74% 60%, transparent 0 14%, rgba(195, 220, 255, .08) 14.2% 14.35%, transparent 14.6% 23%, rgba(195, 220, 255, .06) 23.2% 23.35%, transparent 23.6%),
        linear-gradient(90deg, rgba(6, 10, 18, .8), rgba(6, 10, 18, .46) 43%, rgba(6, 10, 18, .08));
      content: "";
    }

    .wallpaper-art {
      position: absolute;
      z-index: -2;
      top: 0;
      right: 4%;
      bottom: 0;
      display: grid;
      width: 53%;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(ellipse, rgba(130, 178, 240, .17), transparent 63%);
    }

    .wallpaper-art img {
      display: block;
      width: 100%;
      height: 100%;
      padding: 28px;
      object-fit: contain;
      filter: drop-shadow(0 15px 40px rgba(0, 0, 0, .34));
    }

    .wallpaper-copy { width: min(590px, 60%); }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--cyan);
      font-size: .72rem;
      font-weight: 780;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    h2 {
      margin: 0;
      font-size: clamp(2.1rem, 5vw, 4rem);
      font-weight: 730;
      letter-spacing: -.055em;
      line-height: 1.02;
      text-wrap: balance;
    }

    .wallpaper-description {
      max-width: 440px;
      margin: 14px 0 0;
      color: #c1cad9;
      font-size: .96rem;
      line-height: 1.6;
    }

    .image-missing::after {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      padding: 16px;
      color: rgba(224, 236, 255, .72);
      content: attr(data-fallback);
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: .08em;
      text-align: center;
      text-transform: uppercase;
    }

    .wallpaper-art.image-missing::after { font-size: clamp(1.4rem, 3vw, 2.3rem); }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      align-items: stretch;
    }

    .dashboard-card {
      position: relative;
      min-height: 190px;
      overflow: hidden;
      padding: 20px;
      border: 1px solid rgba(224, 234, 255, .09);
      border-radius: 15px;
      background: linear-gradient(145deg, rgba(29, 34, 44, .96), rgba(18, 22, 32, .98));
      box-shadow: 0 14px 38px rgba(0, 0, 0, .2);
    }

    .dashboard-card h3 {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      font-size: .96rem;
      font-weight: 720;
    }

    .card-icon { color: var(--cyan); font-size: 1.05rem; }

    .genre-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 21px;
    }

    .genre-chip {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border: 1px solid rgba(224, 234, 255, .12);
      border-radius: 18px;
      color: #dce3ee;
      background: rgba(255, 255, 255, .045);
      cursor: pointer;
      font-size: .76rem;
      transition: border-color .18s ease, background .18s ease;
    }

    .genre-chip:hover, .genre-chip[aria-pressed="true"] {
      border-color: rgba(139, 234, 255, .56);
      background: rgba(139, 234, 255, .12);
    }

    .genre-chip span {
      color: #9aa7ba;
      font-size: .68rem;
    }

    .collection-summary {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 21px 0 15px;
    }

    .collection-number {
      color: #fff;
      font-size: 2.1rem;
      font-weight: 760;
      letter-spacing: -.06em;
      line-height: 1;
    }

    .collection-label { color: var(--muted); font-size: .82rem; }

    .collection-games {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .collection-games span {
      padding: 6px 9px;
      border-radius: 7px;
      color: #cad3e2;
      background: rgba(255, 255, 255, .055);
      font-size: .72rem;
    }

    .selection-title {
      margin: 19px 0 7px;
      font-size: 1.12rem;
      font-weight: 730;
      letter-spacing: -.025em;
    }

    .selection-description {
      min-height: 39px;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.5;
    }

    .play-button {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 13px;
      border-radius: 7px;
      color: #08131b;
      background: #b6f2ff;
      font-size: .78rem;
      font-weight: 780;
      text-decoration: none;
      transition: transform .18s ease, background .18s ease;
    }

    .play-button:hover { transform: translateY(-2px); background: #d2f7ff; }

    .empty {
      grid-column: 1 / -1;
      padding: 24px 18px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 900px) {
      .topbar, main { width: calc(100% - 44px); }
      .games { gap: 10px; }
      .dashboard { grid-template-columns: 1fr 1fr; }
      .selection-card { grid-column: 1 / -1; }
      .wallpaper { margin-inline: -22px; padding-inline: 38px; }
    }

    @media (max-width: 600px) {
      .topbar, main { width: calc(100% - 30px); }
      .topbar { grid-template-columns: 1fr auto; min-height: 70px; }
      .brand { gap: 8px; }
      .brand img { width: 64px; height: 34px; }
      .brand-name { font-size: .68rem; letter-spacing: .11em; }
      .nav-links { grid-column: 1 / -1; grid-row: 2; height: 42px; gap: 22px; }
      .nav-links a { font-size: .86rem; }
      .topbar-search { grid-column: 2; grid-row: 1; width: min(42vw, 190px); }
      .topbar-search input { height: 34px; font-size: .75rem; }
      main { padding-top: 21px; }
      .section-heading { align-items: baseline; }
      .count { font-size: .72rem; }
      .games { gap: 9px; }
      .game-tile { flex-basis: 84px; }
      .game-tile[aria-pressed="true"] { flex-basis: 105px; }
      .wallpaper {
        min-height: 365px;
        margin: 3px -15px 16px;
        padding: 24px 22px;
      }
      .wallpaper-art { top: 0; right: 0; bottom: auto; width: 100%; height: 66%; opacity: .7; }
      .wallpaper-art img { padding: 18px; }
      .wallpaper::before {
        background: linear-gradient(180deg, rgba(6, 10, 18, .04), rgba(6, 10, 18, .44) 36%, rgba(6, 10, 18, .98) 76%);
      }
      .wallpaper-copy { width: 100%; }
      h2 { font-size: clamp(2rem, 10vw, 3rem); }
      .wallpaper-description { margin-top: 10px; font-size: .87rem; }
      .dashboard { grid-template-columns: 1fr; gap: 11px; }
      .dashboard-card, .selection-card { grid-column: auto; min-height: auto; padding: 17px; }
      .selection-description { min-height: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#accueil" aria-label="Game Center, accueil">
      <img src="gamecenter.jpeg" alt="">
      <span class="brand-name">Game Center</span>
    </a>
    <nav class="nav-links" aria-label="Navigation principale">
      <a href="#bibliotheque" aria-current="page">Bibliothèque</a>
    </nav>
    <label class="topbar-search">
      <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none">
        <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="2"></circle>
        <path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
      </svg>
      <input id="search" type="search" placeholder="Rechercher un jeu…" aria-label="Rechercher un jeu">
    </label>
  </header>

  <main id="accueil">
    <section aria-labelledby="games-heading">
      <div class="section-heading">
        <h1 id="games-heading">Bibliothèque</h1>
        <p class="count" id="count" aria-live="polite"></p>
      </div>
      <div class="games" id="games" role="group" aria-label="Sélectionner un jeu"></div>
    </section>

    <section class="wallpaper" aria-labelledby="featured-title">
      <div class="wallpaper-copy">
        <p class="eyebrow" id="featured-genre"></p>
        <h2 id="featured-title"></h2>
        <p class="wallpaper-description" id="featured-description"></p>
      </div>
      <div class="wallpaper-art" id="featured-art" aria-hidden="true">
        <img id="featured-image" src="" alt="">
      </div>
    </section>

    <section class="dashboard" id="bibliotheque" aria-label="Aperçu de la bibliothèque">
      <article class="dashboard-card">
        <h3><span class="card-icon" aria-hidden="true">✦</span>Explorer par genre</h3>
        <div class="genre-list" id="genres" aria-label="Filtrer les jeux par genre"></div>
      </article>

      <article class="dashboard-card">
        <h3><span class="card-icon" aria-hidden="true">▦</span>Votre bibliothèque</h3>
        <div class="collection-summary">
          <span class="collection-number" id="collection-count"></span>
          <span class="collection-label">jeux à découvrir</span>
        </div>
        <div class="collection-games" id="collection-games" aria-label="Genres disponibles"></div>
      </article>

      <article class="dashboard-card selection-card">
        <h3><span class="card-icon" aria-hidden="true">▶</span>À la une</h3>
        <p class="selection-title" id="selection-title"></p>
        <p class="selection-description" id="selection-description"></p>
        <a class="play-button" id="featured-link" href="" target="_blank" rel="noopener noreferrer">
          <span aria-hidden="true">▶</span><span>Lancer le jeu</span>
        </a>
      </article>
    </section>
  </main>

  <script>
    // Pour modifier le catalogue, change cette liste dans le code.
    const jeux = [
      {
        title: "Le Gardien du Cimetière",
        genre: "Aventure",
        description: "Un jeu d’évasion dans un cimetière mystérieux.",
        image: "gardien-du-cimetiere.jpeg",
        link: "https://maxrp57.github.io/Cimeti-re-/"
      },
      {
        title: "Aéropilote",
        genre: "Simulation",
        description: "Un simulateur de vol pour prendre les commandes.",
        image: "aeropilote.jpeg",
        link: "https://maxrp57.github.io/Air/"
      },
      {
        title: "Dossier Secret",
        genre: "Mystère",
        description: "Un jeu d’enquête et de mystère.",
        image: "dossier-secret.jpeg",
        link: "https://maxrp57.github.io/redfile/"
      }
    ];

    const grille = document.querySelector("#games");
    const recherche = document.querySelector("#search");
    const compteur = document.querySelector("#count");
    const imageVedette = document.querySelector("#featured-image");
    const visuelVedette = document.querySelector("#featured-art");
    const genres = [...new Set(jeux.map(jeu => jeu.genre))];
    let jeuSelectionne = jeux[0];
    let genreSelectionne = "";

    function marquerImageManquante(image, conteneur, titre) {
      image.addEventListener("error", () => {
        image.hidden = true;
        conteneur.classList.add("image-missing");
        conteneur.dataset.fallback = titre;
      });
    }

    function mettreEnAvant(jeu) {
      jeuSelectionne = jeu;
      document.querySelector("#featured-genre").textContent = jeu.genre;
      document.querySelector("#featured-title").textContent = jeu.title;
      document.querySelector("#featured-description").textContent = jeu.description;
      document.querySelector("#featured-link").href = jeu.link;
      document.querySelector("#selection-title").textContent = jeu.title;
      document.querySelector("#selection-description").textContent = jeu.description;

      visuelVedette.classList.remove("image-missing");
      visuelVedette.dataset.fallback = jeu.title;
      imageVedette.hidden = false;
      imageVedette.src = jeu.image;
      grille.querySelectorAll(".game-tile").forEach(tile => {
        tile.setAttribute("aria-pressed", String(tile.dataset.title === jeu.title));
      });
    }

    function afficherJeux() {
      const terme = recherche.value.trim().toLocaleLowerCase("fr");
      const resultats = jeux.filter(jeu =>
        (!genreSelectionne || jeu.genre === genreSelectionne) &&
        `${jeu.title} ${jeu.genre} ${jeu.description}`.toLocaleLowerCase("fr").includes(terme)
      );

      compteur.textContent = `${resultats.length} jeu${resultats.length === 1 ? "" : "x"} dans votre catalogue`;
      grille.replaceChildren();

      if (resultats.length === 0) {
        const message = document.createElement("p");
        message.className = "empty";
        message.textContent = "Aucun jeu trouvé. Essayez une autre recherche ou un autre genre.";
        grille.append(message);
        return;
      }

      if (!resultats.includes(jeuSelectionne)) mettreEnAvant(resultats[0]);

      resultats.forEach(jeu => {
        const tuile = document.createElement("button");
        tuile.className = "game-tile";
        tuile.type = "button";
        tuile.dataset.title = jeu.title;
        tuile.setAttribute("aria-pressed", String(jeu === jeuSelectionne));
        tuile.setAttribute("aria-label", `Mettre ${jeu.title} à la une`);
        tuile.addEventListener("click", () => mettreEnAvant(jeu));

        const visuel = document.createElement("span");
        visuel.className = "tile-art";
        visuel.dataset.fallback = jeu.title;
        const image = document.createElement("img");
        image.src = jeu.image;
        image.alt = "";
        image.loading = "lazy";
        marquerImageManquante(image, visuel, jeu.title);
        visuel.append(image);

        tuile.append(visuel);
        tuile.addEventListener("keydown", event => {
          if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
          const tuiles = [...grille.querySelectorAll(".game-tile")];
          const index = tuiles.indexOf(tuile);
          const nextIndex = event.key === "Home" ? 0
            : event.key === "End" ? tuiles.length - 1
              : (index + (event.key === "ArrowRight" ? 1 : -1) + tuiles.length) % tuiles.length;
          event.preventDefault();
          tuiles[nextIndex].focus();
          tuiles[nextIndex].click();
        });
        grille.append(tuile);
      });
    }

    function choisirGenre(genre) {
      genreSelectionne = genreSelectionne === genre ? "" : genre;
      document.querySelectorAll(".genre-chip").forEach(bouton => {
        bouton.setAttribute("aria-pressed", String(bouton.dataset.genre === genreSelectionne));
      });
      afficherJeux();
    }

    visuelVedette.dataset.fallback = jeuSelectionne.title;
    marquerImageManquante(imageVedette, visuelVedette, jeuSelectionne.title);

    const listeGenres = document.querySelector("#genres");
    genres.forEach(genre => {
      const bouton = document.createElement("button");
      bouton.className = "genre-chip";
      bouton.type = "button";
      bouton.dataset.genre = genre;
      bouton.setAttribute("aria-pressed", "false");
      const titre = document.createElement("span");
      titre.textContent = genre;
      const nombre = document.createElement("span");
      nombre.textContent = jeux.filter(jeu => jeu.genre === genre).length;
      nombre.setAttribute("aria-label", `${nombre.textContent} jeu`);
      bouton.append(titre, nombre);
      bouton.addEventListener("click", () => choisirGenre(genre));
      listeGenres.append(bouton);
    });

    document.querySelector("#collection-count").textContent = jeux.length;
    const listeCollection = document.querySelector("#collection-games");
    genres.forEach(genre => {
      const etiquette = document.createElement("span");
      etiquette.textContent = genre;
      listeCollection.append(etiquette);
    });

    document.querySelectorAll(".nav-links a").forEach(lien => {
      lien.addEventListener("click", () => {
        document.querySelectorAll(".nav-links a").forEach(item => item.removeAttribute("aria-current"));
        lien.setAttribute("aria-current", "page");
      });
    });
    recherche.addEventListener("input", afficherJeux);

    mettreEnAvant(jeuSelectionne);
    afficherJeux();
  </script>
</body>
</html>
