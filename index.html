<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b13">
  <title>Game Center — Accueil</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f7fc;
      background: #080b13;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #a4adbf;
      --line: rgba(224, 234, 255, .13);
      --cyan: #7cecff;
      --page-width: 1280px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 82% 4%, rgba(52, 94, 180, .2), transparent 34rem),
        radial-gradient(ellipse at 5% 46%, rgba(62, 92, 161, .11), transparent 35rem),
        #080b13;
    }

    button, input, select { font: inherit; }
    button, a, input, select { -webkit-tap-highlight-color: transparent; }

    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 4px;
    }

    .page {
      width: min(var(--page-width), calc(100% - 72px));
      margin-inline: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 90px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      color: inherit;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: 112px;
      height: 45px;
      object-fit: cover;
      object-position: center;
      border-radius: 7px;
      background: #111827;
    }

    .brand-name {
      color: #f4f6fb;
      font-size: .79rem;
      font-weight: 760;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .topbar-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: .82rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8cf0c8;
      box-shadow: 0 0 13px rgba(140, 240, 200, .7);
    }

    main { padding: 38px 0 70px; }

    .welcome {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin: 0 0 23px;
    }

    .welcome p {
      margin: 0 0 7px;
      color: var(--cyan);
      font-size: .71rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .welcome .library-count {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: .88rem;
      font-weight: 400;
      letter-spacing: normal;
      text-transform: none;
      white-space: nowrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.15rem);
      font-weight: 720;
      letter-spacing: -.055em;
    }

    .library-count {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: .88rem;
      white-space: nowrap;
    }

    .featured {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(260px, .85fr);
      min-height: 354px;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid rgba(204, 221, 255, .17);
      border-radius: 22px;
      background:
        radial-gradient(ellipse at 78% 45%, rgba(81, 137, 222, .27), transparent 37%),
        linear-gradient(115deg, #151d2b 0%, #111a2a 52%, #111522 100%);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .28);
    }

    .featured::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(90deg, rgba(10, 14, 23, .95) 0%, rgba(10, 14, 23, .76) 46%, rgba(10, 14, 23, .1) 100%);
      content: "";
    }

    .featured-copy {
      z-index: 1;
      align-self: center;
      padding: clamp(28px, 5vw, 64px);
    }

    .featured-label {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 22px;
      color: #d3edff;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .featured-label::before {
      width: 19px;
      height: 1px;
      background: var(--cyan);
      content: "";
    }

    .featured-genre {
      margin: 0 0 10px;
      color: var(--cyan);
      font-size: .8rem;
      font-weight: 720;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h2 {
      max-width: 650px;
      margin: 0;
      font-size: clamp(2rem, 4.7vw, 3.55rem);
      font-weight: 730;
      letter-spacing: -.055em;
      line-height: 1.05;
      text-wrap: balance;
    }

    .featured-description {
      max-width: 440px;
      margin: 17px 0 25px;
      color: #bdc5d5;
      font-size: .98rem;
      line-height: 1.65;
    }

    .featured-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .play-button, .browse-button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 9px;
      font-size: .87rem;
      font-weight: 760;
      text-decoration: none;
      transition: transform .18s ease, background-color .18s ease, border-color .18s ease;
    }

    .play-button {
      color: #071017;
      background: #b6f2ff;
      box-shadow: 0 8px 26px rgba(83, 203, 237, .2);
    }

    .browse-button {
      color: #edf2fb;
      border-color: rgba(222, 234, 255, .23);
      background: rgba(255, 255, 255, .055);
    }

    .play-button:hover, .browse-button:hover { transform: translateY(-2px); }
    .play-button:hover { background: #d2f7ff; }
    .browse-button:hover { border-color: rgba(222, 234, 255, .52); background: rgba(255, 255, 255, .1); }

    .featured-art {
      position: absolute;
      z-index: -2;
      top: 0;
      right: 0;
      bottom: 0;
      display: grid;
      width: 57%;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 62% 48%, rgba(137, 191, 255, .22), transparent 46%),
        linear-gradient(135deg, rgba(61, 88, 140, .3), rgba(11, 16, 29, .2));
    }

    .featured-art img {
      display: block;
      width: 100%;
      height: 100%;
      padding: 35px;
      object-fit: contain;
      filter: drop-shadow(0 20px 34px rgba(0, 0, 0, .32));
    }

    .image-missing::after {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      padding: 16px;
      color: rgba(224, 236, 255, .7);
      content: attr(data-fallback);
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: .08em;
      text-align: center;
      text-transform: uppercase;
    }

    .featured-art.image-missing::after { font-size: clamp(1.25rem, 3vw, 2rem); }

    .shelf { margin-top: 40px; }

    .shelf-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    .shelf-title {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    h3 {
      margin: 0;
      font-size: 1.18rem;
      font-weight: 680;
      letter-spacing: -.025em;
    }

    .shelf-hint {
      margin: 0;
      color: #828da2;
      font-size: .78rem;
    }

    .shelf-controls {
      display: flex;
      gap: 8px;
    }

    .shelf-arrow {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: #e8edf7;
      background: rgba(255, 255, 255, .045);
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease;
    }

    .shelf-arrow:hover { border-color: rgba(124, 236, 255, .45); background: rgba(124, 236, 255, .1); }

    .games {
      display: grid;
      grid-auto-columns: minmax(190px, 1fr);
      grid-auto-flow: column;
      gap: 15px;
      overflow-x: auto;
      padding: 3px 3px 14px;
      scroll-behavior: smooth;
      scrollbar-color: rgba(174, 193, 223, .3) transparent;
      scrollbar-width: thin;
    }

    .game-tile {
      min-width: 0;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: inherit;
      background: rgba(20, 25, 37, .82);
      cursor: pointer;
      text-align: left;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .game-tile:hover { transform: translateY(-3px); border-color: rgba(205, 222, 255, .34); }

    .game-tile[aria-pressed="true"] {
      border-color: rgba(124, 236, 255, .82);
      background: rgba(30, 48, 65, .95);
      box-shadow: 0 0 0 1px rgba(124, 236, 255, .23), 0 10px 28px rgba(0, 0, 0, .22);
    }

    .tile-art {
      position: relative;
      display: block;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(112, 147, 195, .22), transparent 58%),
        #111725;
    }

    .tile-art img {
      display: block;
      width: 100%;
      height: 100%;
      padding: 12px;
      object-fit: contain;
      transition: transform .25s ease;
    }

    .game-tile:hover .tile-art img { transform: scale(1.045); }

    .tile-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px 14px;
    }

    .tile-title {
      display: block;
      overflow: hidden;
      font-size: .88rem;
      font-weight: 720;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tile-genre {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: .73rem;
    }

    .tile-mark {
      flex: 0 0 auto;
      color: var(--cyan);
      font-size: 1.05rem;
      opacity: 0;
      transform: translateX(-3px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .game-tile[aria-pressed="true"] .tile-mark { opacity: 1; transform: translateX(0); }

    .library-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 32px;
      padding-top: 23px;
      border-top: 1px solid var(--line);
    }

    .library-tools label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    .library-tools input, .library-tools select {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: #f5f7fc;
      background: rgba(19, 24, 36, .92);
    }

    .library-tools input {
      flex: 1;
      min-width: 0;
      padding: 0 14px;
    }

    .library-tools select { padding: 0 34px 0 12px; }
    .library-tools input::placeholder { color: #8993a7; }
    .library-tools input:focus, .library-tools select:focus { border-color: rgba(124, 236, 255, .65); }

    .empty {
      grid-column: 1 / -1;
      padding: 26px 18px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 760px) {
      .page { width: min(var(--page-width), calc(100% - 40px)); }
      .featured { min-height: 340px; grid-template-columns: 1fr; }
      .featured-copy { max-width: 680px; padding: 38px; }
      .featured-art { width: 63%; opacity: .72; }
      .featured::before { background: linear-gradient(90deg, rgba(10, 14, 23, .97) 0%, rgba(10, 14, 23, .82) 52%, rgba(10, 14, 23, .32) 100%); }
      .games { grid-auto-columns: minmax(195px, 42%); }
    }

    @media (max-width: 520px) {
      .page { width: calc(100% - 30px); }
      .topbar { min-height: 72px; }
      .brand { gap: 9px; }
      .brand img { width: 82px; height: 37px; }
      .brand-name { font-size: .66rem; letter-spacing: .11em; }
      .topbar-meta { gap: 7px; font-size: .73rem; }
      main { padding-top: 29px; }
      .welcome { align-items: start; flex-direction: column; gap: 7px; }
      .library-count { margin-bottom: 0; }
      .featured { min-height: 390px; border-radius: 17px; }
      .featured-copy { align-self: end; padding: 27px 22px; }
      .featured-art { top: 0; bottom: auto; width: 100%; height: 62%; opacity: .62; }
      .featured-art img { padding: 22px; }
      .featured::before { background: linear-gradient(180deg, rgba(10, 14, 23, .06) 0%, rgba(10, 14, 23, .48) 40%, rgba(10, 14, 23, .97) 76%); }
      .featured-label { margin-bottom: 14px; }
      .featured-description { margin: 12px 0 18px; font-size: .9rem; }
      .play-button, .browse-button { min-height: 43px; padding-inline: 14px; font-size: .82rem; }
      .shelf { margin-top: 31px; }
      .shelf-heading { align-items: start; }
      .shelf-title { display: block; }
      .shelf-hint { margin-top: 4px; }
      .shelf-controls { gap: 6px; }
      .shelf-arrow { width: 33px; height: 33px; }
      .games { grid-auto-columns: minmax(180px, 72%); gap: 11px; }
      .library-tools { align-items: stretch; flex-direction: column; gap: 9px; margin-top: 21px; padding-top: 18px; }
      .library-tools select { min-height: 43px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="#accueil" aria-label="Game Center, accueil">
        <img src="gamecenter.jpeg" alt="">
        <span class="brand-name">Game Center</span>
      </a>
      <div class="topbar-meta"><span class="status-dot" aria-hidden="true"></span><span>Votre espace de jeux</span></div>
    </header>

    <main id="accueil">
      <div class="welcome">
        <div>
          <p>Bienvenue dans votre espace</p>
          <h1>À quoi on joue ?</h1>
        </div>
        <p class="library-count" id="count" aria-live="polite"></p>
      </div>

      <section class="featured" aria-labelledby="featured-title">
        <div class="featured-copy">
          <p class="featured-label">À la une</p>
          <p class="featured-genre" id="featured-genre"></p>
          <h2 id="featured-title"></h2>
          <p class="featured-description" id="featured-description"></p>
          <div class="featured-actions">
            <a class="play-button" id="featured-link" href="" target="_blank" rel="noopener noreferrer">
              <span aria-hidden="true">▶</span><span>Lancer le jeu</span>
            </a>
            <a class="browse-button" href="#bibliotheque">Parcourir les jeux</a>
          </div>
        </div>
        <div class="featured-art" id="featured-art" aria-hidden="true">
          <img id="featured-image" src="" alt="">
        </div>
      </section>

      <section class="shelf" id="bibliotheque" aria-labelledby="shelf-heading">
        <div class="shelf-heading">
          <div class="shelf-title">
            <h3 id="shelf-heading">Vos jeux</h3>
            <p class="shelf-hint">Choisissez une jaquette pour la mettre à la une</p>
          </div>
          <div class="shelf-controls" aria-label="Navigation dans les jeux">
            <button class="shelf-arrow" id="previous" type="button" aria-label="Faire défiler les jeux vers la gauche">‹</button>
            <button class="shelf-arrow" id="next" type="button" aria-label="Faire défiler les jeux vers la droite">›</button>
          </div>
        </div>

        <div class="games" id="games" role="group" aria-label="Sélectionner un jeu"></div>

        <div class="library-tools">
          <label for="search">Rechercher un jeu</label>
          <input id="search" type="search" placeholder="Rechercher dans votre catalogue…">
          <label for="genre">Filtrer par genre</label>
          <select id="genre">
            <option value="">Tous les genres</option>
          </select>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Pour modifier le catalogue, change cette liste dans le code.
    const jeux = [
      {
        title: "Le Gardien du Cimetière",
        genre: "Aventure",
        description: "Un jeu d’évasion dans un cimetière mystérieux.",
        image: "gardien-du-cimetiere.jpeg",
        link: "https://maxrp57.github.io/Cimeti-re-/"
      },
      {
        title: "Aéropilote",
        genre: "Simulation",
        description: "Un simulateur de vol pour prendre les commandes.",
        image: "aeropilote.jpeg",
        link: "https://maxrp57.github.io/Air/"
      },
      {
        title: "Dossier Secret",
        genre: "Mystère",
        description: "Un jeu d’enquête et de mystère.",
        image: "dossier-secret.jpeg",
        link: "https://maxrp57.github.io/redfile/"
      }
    ];

    const grille = document.querySelector("#games");
    const recherche = document.querySelector("#search");
    const filtreGenre = document.querySelector("#genre");
    const compteur = document.querySelector("#count");
    const imageVedette = document.querySelector("#featured-image");
    const visuelVedette = document.querySelector("#featured-art");
    let jeuSelectionne = jeux[0];

    [...new Set(jeux.map(jeu => jeu.genre))].forEach(genre => {
      filtreGenre.add(new Option(genre, genre));
    });

    function marquerImageManquante(image, conteneur, titre) {
      image.addEventListener("error", () => {
        image.hidden = true;
        conteneur.classList.add("image-missing");
        conteneur.dataset.fallback = titre;
      });
    }

    visuelVedette.dataset.fallback = jeuSelectionne.title;
    marquerImageManquante(imageVedette, visuelVedette, jeuSelectionne.title);

    function mettreEnAvant(jeu) {
      jeuSelectionne = jeu;
      document.querySelector("#featured-genre").textContent = jeu.genre;
      document.querySelector("#featured-title").textContent = jeu.title;
      document.querySelector("#featured-description").textContent = jeu.description;
      document.querySelector("#featured-link").href = jeu.link;

      visuelVedette.classList.remove("image-missing");
      visuelVedette.dataset.fallback = jeu.title;
      imageVedette.hidden = false;
      imageVedette.src = jeu.image;

      grille.querySelectorAll(".game-tile").forEach(tile => {
        const selected = tile.dataset.title === jeu.title;
        tile.setAttribute("aria-pressed", String(selected));
      });
    }

    function afficherJeux() {
      const terme = recherche.value.trim().toLocaleLowerCase("fr");
      const genre = filtreGenre.value;
      const resultats = jeux.filter(jeu =>
        (!genre || jeu.genre === genre) &&
        `${jeu.title} ${jeu.genre} ${jeu.description}`.toLocaleLowerCase("fr").includes(terme)
      );

      compteur.textContent = `${resultats.length} jeu${resultats.length === 1 ? "" : "x"} dans votre catalogue`;
      grille.replaceChildren();

      if (resultats.length === 0) {
        const message = document.createElement("p");
        message.className = "empty";
        message.textContent = "Aucun jeu trouvé. Essayez une autre recherche ou un autre genre.";
        grille.append(message);
        return;
      }

      if (!resultats.includes(jeuSelectionne)) mettreEnAvant(resultats[0]);

      resultats.forEach(jeu => {
        const tuile = document.createElement("button");
        tuile.className = "game-tile";
        tuile.type = "button";
        tuile.dataset.title = jeu.title;
        tuile.setAttribute("aria-pressed", String(jeu === jeuSelectionne));
        tuile.setAttribute("aria-label", `Mettre ${jeu.title} à la une`);
        tuile.addEventListener("click", () => mettreEnAvant(jeu));

        const visuel = document.createElement("span");
        visuel.className = "tile-art";
        visuel.dataset.fallback = jeu.title;

        const image = document.createElement("img");
        image.src = jeu.image;
        image.alt = "";
        image.loading = "lazy";
        marquerImageManquante(image, visuel, jeu.title);
        visuel.append(image);

        const meta = document.createElement("span");
        meta.className = "tile-meta";

        const texte = document.createElement("span");
        const titre = document.createElement("span");
        titre.className = "tile-title";
        titre.textContent = jeu.title;
        const categorie = document.createElement("span");
        categorie.className = "tile-genre";
        categorie.textContent = jeu.genre;
        texte.append(titre, categorie);

        const marque = document.createElement("span");
        marque.className = "tile-mark";
        marque.setAttribute("aria-hidden", "true");
        marque.textContent = "✓";
        meta.append(texte, marque);
        tuile.append(visuel, meta);
        grille.append(tuile);
      });
    }

    grille.addEventListener("keydown", event => {
      if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
      const tuiles = [...grille.querySelectorAll(".game-tile")];
      const index = tuiles.indexOf(document.activeElement);
      if (index < 0 || tuiles.length === 0) return;

      event.preventDefault();
      const nextIndex = event.key === "Home" ? 0
        : event.key === "End" ? tuiles.length - 1
          : (index + (event.key === "ArrowRight" ? 1 : -1) + tuiles.length) % tuiles.length;
      tuiles[nextIndex].focus();
      tuiles[nextIndex].click();
    });

    document.querySelector("#previous").addEventListener("click", () => {
      grille.scrollBy({ left: -grille.clientWidth * .8, behavior: "smooth" });
    });
    document.querySelector("#next").addEventListener("click", () => {
      grille.scrollBy({ left: grille.clientWidth * .8, behavior: "smooth" });
    });
    recherche.addEventListener("input", afficherJeux);
    filtreGenre.addEventListener("change", afficherJeux);

    mettreEnAvant(jeuSelectionne);
    afficherJeux();
  </script>
</body>
</html>
